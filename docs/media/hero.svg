<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="WarmerSun - DRM-free lighting grade for ETS2 and ATS">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="0.62" stop-color="#171310"/>
      <stop offset="1" stop-color="#2a1c12"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffc27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9c4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a8"/>
      <stop offset="0.55" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#sky)"/>
  <circle cx="1075" cy="105" r="210" fill="url(#sun)"/>
  <circle cx="1075" cy="105" r="46" fill="#fff0cf" opacity="0.92"/>

  <g opacity="0.20" stroke="#ffcf9a" stroke-width="1">
    <path d="M0 236 H1280"/>
    <path d="M0 260 H1280"/>
    <path d="M0 292 H1280"/>
  </g>

  <text x="72" y="132" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="76" font-weight="700" fill="url(#warm)">WarmerSun</text>
  <text x="74" y="181" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="27" fill="#e9e4dc">A warm, filmic lighting grade for Euro Truck Simulator 2 and ATS.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" fill="#b9b2a7">
    <text x="74" y="236">dxgi.dll + dinput8.dll</text>
    <text x="300" y="236">adaptive exposure</text>
    <text x="520" y="236">four presets</text>
    <text x="700" y="236">no account</text>
    <text x="860" y="236">no licence server</text>
    <text x="1070" y="236">no telemetry</text>
  </g>

  <g transform="translate(74,268)">
    <rect width="188" height="42" rx="21" fill="#ff9c4a"/>
    <text x="94" y="27" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a120b">DRM-FREE</text>
  </g>
  <text x="286" y="295" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" fill="#8f887e">Windows x64  ·  source included  ·  no third-party assets</text>
</svg>

