name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build and package
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1 -SkipBuild -Version "${GITHUB_REF_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarmerSun
          path: dist/WarmerSun.zip
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const assetName = 'WarmerSun.zip';
            const data = fs.readFileSync('dist/WarmerSun.zip');

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `WarmerSun ${tag}`,
                generate_release_notes: true
              })).data;
            }

            const assets = (await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: release.id, per_page: 100
            })).data;
            for (const asset of assets.filter(a => a.name === assetName)) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: release.id, name: assetName,
              data,
              headers: {
                'content-type': 'application/zip',
                'content-length': data.length
              }
            });
