; ============================================================================
;  WarmerSun - warm, filmic lighting grade for Euro Truck Simulator 2 / ATS
;  DRM-free. No account, no license server, no network access.
;
;  Drop dxgi.dll + dinput8.dll + this file into:
;      <game>\bin\win_x64\
;
;  Hotkeys (change below):
;      F10  toggle the grade on/off (A/B comparison)
;      F11  cycle preset A -> B -> C -> D
;      F12  reload this file while the game is running
;
;  Values are applied live on the next presented frame. To disable the mod
;  completely before launch, create an empty file named "WarmerSun.off" next
;  to the DLLs (or set Disable=1 below).
; ============================================================================

[WarmerSun]
Enabled=1
; Disable=1 is equivalent to Enabled=0 and skips hooking entirely.
Disable=0
; SafeMode=1 keeps the DLL loaded but never draws.
SafeMode=0
Verbose=1

; A = natural, B = cinematic, C = night, D = WarmerSun default
Preset=D

KeyToggle=F10
KeyPreset=F11
KeyReload=F12

; Optional verification: write the graded back buffer to a .dds after N frames.
DumpFrames=0
DumpAfter=120
DumpCount=1

; ----------------------------------------------------------------------------
; Preset A - Natural
; Subtle correction. Good for vanilla-looking sessions with cleaner highlights.
; ----------------------------------------------------------------------------
[Preset.A]
Temperature=3.0
Tint=0.0
PreExposure=0.0
Exposure=0.0
PreContrast=1.0
Contrast=1.02
Saturation=1.03
Vibrance=0.10
Highlights=-0.06
Shadows=0.03
Whites=0.00
Blacks=0.00
NightExposure=0.25
SunWarmth=0.20

Dynamic=1
AdaptSpeed=1.0
Key=0.18
MinEV=-2.0
MaxEV=1.0

Sharpen=1
Sharpness=0.15
SharpenEdges=0.40

; ----------------------------------------------------------------------------
; Preset B - Cinematic
; Deeper contrast, stronger highlight roll-off, more vibrance and sharpening.
; ----------------------------------------------------------------------------
[Preset.B]
Temperature=6.0
Tint=0.0
PreExposure=0.0
Exposure=0.0
PreContrast=1.0
Contrast=1.10
Saturation=1.10
Vibrance=0.20
Highlights=-0.14
Shadows=0.08
Whites=0.02
Blacks=-0.04
NightExposure=0.35
SunWarmth=0.35

Dynamic=1
AdaptSpeed=1.4
Key=0.15
MinEV=-2.0
MaxEV=1.5

Sharpen=1
Sharpness=0.35
SharpenEdges=0.45

; ----------------------------------------------------------------------------
; Preset C - Night
; Lifts dark scenes without washing out headlights; lower saturation.
; ----------------------------------------------------------------------------
[Preset.C]
Temperature=2.0
Tint=0.0
PreExposure=0.0
Exposure=0.0
PreContrast=1.0
Contrast=1.04
Saturation=1.02
Vibrance=0.12
Highlights=-0.08
Shadows=0.10
Whites=0.00
Blacks=-0.02
NightExposure=0.70
SunWarmth=0.15

Dynamic=1
AdaptSpeed=0.7
Key=0.20
MinEV=-2.0
MaxEV=2.0

Sharpen=1
Sharpness=0.25
SharpenEdges=0.35

; ----------------------------------------------------------------------------
; Preset D - WarmerSun (default)
; Golden-hour warmth in the highlights, controlled whites, lifted but neutral
; shadows, gentle vibrance and CAS sharpening.
; ----------------------------------------------------------------------------
[Preset.D]
; -100..100. Positive pushes the image warmer (more red, less blue).
Temperature=9.0
; -100..100. Positive pushes toward magenta, negative toward green.
Tint=1.0

; Exposure in EV, applied before/after the contrast curves.
PreExposure=0.0
Exposure=0.0

; Power curves around a 0.18 middle grey. 1.0 = neutral.
PreContrast=1.0
Contrast=1.06

; 0..2 (1.0 = untouched) and -1..1.
Saturation=1.07
Vibrance=0.18

; Tonal zones, -1..1. Negative highlights recover bright sky and snow.
Highlights=-0.12
Shadows=0.07
Whites=0.02
Blacks=-0.03

; Extra EV applied only to dark scenes (0 = disabled).
NightExposure=0.45

; 0..1. Warm tint applied to the top end of the curve - the signature look.
SunWarmth=0.40

; Adaptive exposure (eye adaptation). AdaptSpeed is in 1/seconds.
Dynamic=1
AdaptSpeed=1.0
Key=0.16
MinEV=-2.0
MaxEV=1.5

; Contrast adaptive sharpening. 0.20 / 0.40 are the reference defaults
; (its registry stores 2/10 sharpness and 4/10 sharpen-edges).
Sharpen=1
Sharpness=0.20
SharpenEdges=0.40
